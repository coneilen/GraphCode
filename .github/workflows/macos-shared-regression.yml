name: macOS shared Swift regression

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      macos: ${{ steps.classify.outputs.macos }}
      linux: ${{ steps.classify.outputs.linux }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash Tools/ci/classify-changes.sh --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.macos == 'true') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Prepare portable Swift sources
        run: python3 Tools/portable-prepare.py
      - name: Install pinned mise tools
        run: |
          brew install mise
          mise install
      - name: Validate shared portable Swift package
        run: mise exec -- swift test --package-path investigation/spikes/swift-portable
      - name: Install Tuist dependencies
        run: mise exec -- tuist install
      - name: Build and install zmx
        run: mise exec -- make install-zmx
      - name: Validate macOS app, daemon, and CLI
        timeout-minutes: 30
        run: mise exec -- make test
      - name: Validate macOS lint and formatting
        run: mise exec -- make check
