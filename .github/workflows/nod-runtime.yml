name: Nod runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "NodRuntime/**"
      - "GraphcodeKit/Sources/Domain/NodProtocol.swift"
      - ".github/workflows/nod-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    name: bun test + typecheck
    # macOS for the contract test, which compiles NodProtocol.swift with swiftc.
    runs-on: macos-26
    defaults:
      run:
        working-directory: NodRuntime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun ./node_modules/.bin/tsc --noEmit -p .
      - run: bun test
      - name: Compile
        run: bun build src/main.ts --compile --outfile dist/graphcode-nod && ./dist/graphcode-nod --help
