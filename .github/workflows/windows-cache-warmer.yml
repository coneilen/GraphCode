name: Windows cache warmer

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.ci-tools\zig-global

jobs:
  warm:
    name: Warm pinned Windows dependencies
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 5

      - name: Restore pinned Zig toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-tools/zig-0.15.2
            .ci-tools/zig-0.16.0
          key: windows-zig-v1-${{ hashFiles('Tools/windows/bootstrap.ps1') }}

      - name: Restore pinned provider build caches
        id: provider-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-providers
            .ci-tools/zig-global
          key: windows-providers-v1-${{ hashFiles('graphcode-windows/provider-pins.json', 'Tools/windows/bootstrap.ps1') }}-emit-win32-host-x86_64-windows-gnu

      - name: Bootstrap exact Windows dependencies
        shell: pwsh
        timeout-minutes: 30
        run: ./Tools/windows/bootstrap.ps1 -ToolRoot .ci-tools -ProviderRoot .ci-providers -SkipSwift

      - name: Verify provider pins after cache restore
        shell: pwsh
        timeout-minutes: 5
        run: ./Tools/windows/Assert-ProviderCheckout.ps1 -ProviderRoot .ci-providers

      - name: Build canonical pinned provider artifacts
        shell: pwsh
        timeout-minutes: 30
        run: ./Tools/windows/validate.ps1 -Task terminal-gate

      - name: Save pinned provider build caches
        if: success() && steps.provider-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-providers
            .ci-tools/zig-global
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}
