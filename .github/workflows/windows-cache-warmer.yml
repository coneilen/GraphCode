name: Windows cache warmer

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.ci-tools\zig-global

jobs:
  warm:
    name: Warm pinned Windows dependencies
    runs-on: windows-2022
    # Outer cap = bootstrap step cap (40) + build-only step cap (15) + 5 for
    # checkout, restores, pin check, save, and post steps (about 1.5m observed).
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 5

      - name: Restore pinned Zig toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-tools/zig-0.15.2
            .ci-tools/zig-0.16.0
          key: windows-zig-v1-${{ hashFiles('Tools/windows/bootstrap.ps1') }}

      - name: Restore pinned provider build caches
        id: provider-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-providers
            .ci-tools/zig-global
          key: windows-providers-v1-${{ hashFiles('graphcode-windows/provider-pins.json', 'Tools/windows/bootstrap.ps1') }}-emit-win32-host-x86_64-windows-gnu

      # A healthy cold bootstrap took 26m34s (job 109675286607) and a 30m cap
      # was exceeded on run 36645791783 attempt 1; 40m is about 1.5x the former.
      - name: Bootstrap exact Windows dependencies
        id: bootstrap
        shell: pwsh
        timeout-minutes: 40
        run: ./Tools/windows/bootstrap.ps1 -ToolRoot .ci-tools -ProviderRoot .ci-providers -SkipSwift

      - name: Verify provider pins after cache restore
        id: verify-pins
        shell: pwsh
        timeout-minutes: 5
        run: ./Tools/windows/Assert-ProviderCheckout.ps1 -ProviderRoot .ci-providers

      # Build-only: the same canonical provider compile the shell integration job
      # runs before its gate; no terminal tests or smoke.
      - name: Build canonical pinned provider artifacts
        id: provider-build
        shell: pwsh
        timeout-minutes: 15
        run: ./Tools/windows/validate.ps1 -Task provider-build

      - name: Save pinned provider build caches
        if: ${{ !cancelled() && steps.bootstrap.conclusion == 'success' && steps.verify-pins.conclusion == 'success' && steps.provider-build.conclusion == 'success' && steps.provider-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-providers
            .ci-tools/zig-global
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}
